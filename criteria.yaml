# 주행 합격 판정 기준.
#
# 임계값의 근거: 기본 파라미터(mpc_weight_lat_error=1.0)로 01_straight 를 10회 주행한
# 관측치(2026-08-23, runs/batch_seeded + batch_latw1_recheck)의 최대값에 약 1.5배 여유.
# "근거 없는 숫자를 먼저 박지 않는다" — 데이터를 본 뒤에 정한 값이다.
#
#                          관측 평균   관측 최대   임계값
#   lat_p95      [cm]        6.76       7.96      12.0
#   lat_rms      [cm]        2.82       3.35       5.0
#   jerk_p95     [m/s³]      1.59       1.97       3.0
#   settle_t     [s]        11.3       15.9       25.0
#   goal_lon     [m]         0.31       0.78       1.5
#
# 시나리오 yaml 에 criteria: 블록을 넣으면 그 항목만 여기 값을 덮어쓴다
# (예: 장애물 시나리오는 mid_stops 최소 1회를 요구).

# 완주하지 못한 주행(러너 종료코드 != 0)은 지표와 무관하게 불합격이다.

max:
  lat_p95: 12.0        # 수렴 후 |횡편차| p95 [cm]
  lat_rms: 5.0         # 수렴 후 |횡편차| RMS [cm]
  jerk_p95: 3.0        # |저크| p95 [m/s³]
  settle_t: 25.0       # 스폰 오프셋 수렴 시간 [s]
  goal_lon: 1.5        # 목표 도착 오차 종방향 [m]

# 주행 시간·정지 횟수·최근접 객체 거리는 넣지 않는다.
#   시간/정지  — NPC 교통 노이즈가 지배한다 (반복 폭이 평균보다 크다. WORKLOG 3단계)
#   객체 거리  — 인지 순간 오탐으로 0.00 m 스파이크가 관측됐다. 이 지표로 판정하면 오탐에 걸린다
