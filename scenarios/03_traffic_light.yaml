name: 03_traffic_light
description: >
  스폰 → 신호 교차로(regulatory element 1514·1515·1516, x≈81514) 통과 → 81567 도착.
  외부 신호 채널로 교차로 신호를 빨강으로 강제해 정지선 정지를 확인한 뒤,
  초록으로 바꿔 통과를 본다. 시뮬레이터의 실제 신호 주기와 무관하게 재현된다.
  그룹 ID 는 지도(lanelet2 osm)에서 어제 신호 정지 지점(81514.7, 50002.9)과
  가장 가까운 정지선을 가진 traffic_light regulatory element 로 찾았다.
goal: {x: 81567.6, y: 50015.8, z: 41.5, yaw: 0.35}
timeout_s: 400
traffic_override:
  group_ids: [1514, 1515, 1516]   # 같은 정지선의 차선별 신호 — 전부 빨강이면 자차 차선 포함
  hold_stop_s: 8
criteria:
  # 이 시나리오만의 임계값. 전역 criteria.yaml 은 01_straight(직선 91 m) 10회에서 뽑은
  # 값인데, 03 은 335 m 에 교차로를 지나므로 횡편차 분포 자체가 다르다.
  # 주행이 나빠진 게 아니라 기준이 남의 분포였다 (WORKLOG 28 의 「3/4 불합격」).
  #
  # 근거: 이 시나리오 18회 관측 (2026-08-24, runs/batch_tl10 10회 + batch_tl10_stock 8회.
  # 자체 모듈 ON/OFF 두 조건인데, 이 경로에서는 모듈이 한 번도 개입하지 않아 같은 조건이다).
  # 전역과 같은 규칙 — 관측 최대값에 약 1.5배 여유.
  #
  #                 평균    최소    최대   전역기준   여기 기준
  #   lat_p95  [cm]  9.66   8.64   10.11    12.0       15.0
  #   lat_rms  [cm]  5.07   4.89    5.49     5.0        8.0
  #   jerk_p95        1.17   0.98    1.31     3.0    (전역 유지)
  #   settle_t [s]    9.28   7.83   13.84    25.0    (전역 유지)
  #   goal_lon [m]    0.17   0.01    0.33     1.5    (전역 유지)
  #
  # 저크·수렴시간·목표오차는 전역 기준 안에 넉넉히 들어와 덮어쓰지 않는다.
  # 관측이 더 좁다고 기준을 조이면 표본 10회짜리 잡음에 걸린다.
  max:
    lat_p95: 15.0
    lat_rms: 8.0
  min:
    mid_stops: 1
