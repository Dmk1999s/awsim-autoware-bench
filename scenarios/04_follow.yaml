name: 04_follow
description: >
  01_straight 경로에서 25 m 앞에 2.0 m/s 로 주행하는 앞차를 스폰한다 (자차 제한 4.17 m/s).
  기대: 자차가 따라잡은 뒤 추돌 없이 차간을 유지하며 추종하다, 앞차가 목적지 너머로
  벗어나면 정상 도착한다. 정지 없이 속도 맞춤만으로 해결돼야 한다.
goal: {x: 81470.3, y: 49980.1, z: 41.5, yaw: 0.60}
timeout_s: 300
traffic_override:
  # 경로 초입 신호(1487·1489)를 초록으로 상시 강제. 더미 앞차는 신호를 무시하므로
  # 자차만 빨간불에 걸리면 추종 실험이 성립하지 않는다 (1차 시도에서 실측).
  group_ids: [1487, 1489]
  color: GREEN
objects:
  - {x: 81401.42, y: 49933.04, z: 41.3, yaw: 0.581, label: 1, velocity: 2.0}
criteria:
  # 이 시나리오만의 임계값. 근거: 10회 관측 (2026-08-24, runs/batch_follow10).
  #
  #                 평균    최소    최대   전역기준
  #   lat_p95  [cm]  7.38   6.24    9.12    12.0   (전역 유지)
  #   lat_rms  [cm]  3.23   2.61    5.20     5.0   (전역 유지 — 아래 참고)
  #   jerk_p95       1.53   1.03    2.52     3.0   (전역 유지)
  #   settle_t [s]  17.43   8.01   34.92    25.0 → 50.0
  #   goal_lon [m]   0.22   0.04    0.37     1.5   (전역 유지)
  #
  # settle_t 만 덮어쓴다. 이 지표는 「스폰 오프셋이 가라앉는 시간」인데, 04 는 앞차가
  # 놓아줄 때까지 자차가 서 있으므로 **사실상 출발 시각을 잰다** — 10회 모두
  # settle_t ≈ (1 m/s 도달 시각) + 1.5 s 였다 (WORKLOG 39). 추종 품질과 무관하므로
  # 여기서는 큰 이탈만 잡는 용도로 남긴다.
  #
  # lat_rms 는 올리지 않는다. 10회 중 5.20 이 하나 나왔는데 그것은 회피 기동 회차이고
  # (steering factor `avoidance` 31초), 판정이 그것을 잡아낸 것이 맞다. 기준을 올리면
  # 그 신호가 사라진다.
  max:
    settle_t: 50.0
