  신호는 강제하지 않는다. arbiter 가 카메라 빨강을 우선하므로 초록 강제는 어차피 무력하고
  (WORKLOG 9), 자연 신호로 도는 편이 대향차 흐름과 맞다. 신호 대기는 실패가 아니다.
