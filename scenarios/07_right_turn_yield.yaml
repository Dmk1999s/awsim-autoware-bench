name: 07_right_turn_yield
description: >
  대향차에 양보해야 하는 우회전(lanelet 405)에서 intersection 모듈의 gap acceptance 를 본다.
  06 의 우회전(332)은 지도상 right_of_way 역할이라 양보 대상이 없고, 실제로 intersection
  모듈이 주행 내내 빈 factor 만 발행했다 (WORKLOG 11). 405 는 right_of_way 규제요소
  124266~124270 다섯 개에서 모두 yield 역할이다 — 양보 의무가 지도에 적혀 있는 차선.
  접근 경로 255 → … → 217 → 405 는 전부 후속 연결이라 차선 변경이 필요 없다.
  신호는 강제하지 않는다. 신호 대기는 실패가 아니다.
